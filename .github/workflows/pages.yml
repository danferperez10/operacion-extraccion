name: Publicar Operación Extracción

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar web
        run: |
          mkdir -p _site
          cp index.html main.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos web
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar juego
        id: deployment
        uses: actions/deploy-pages@v4
